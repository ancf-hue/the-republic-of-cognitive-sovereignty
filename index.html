
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Республика Когнитивного Суверенитета - Главная</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0a0a2a 40%, #0f0f3a 100%);
            color: #c9a961;
            min-height: 100vh;
        }

        .main-header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(201, 169, 97, 0.05);
            border-bottom: 2px solid rgba(201, 169, 97, 0.2);
        }

        .logo-frame {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(201, 169, 97, 0.6));
        }

        .rotating-border {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: rotateRainbow 6s linear infinite;
        }

        @keyframes rotateRainbow {
            0% { transform: rotate(0deg); border-color: #ff0000; }
            20% { border-color: #ffff00; }
            40% { border-color: #00ff00; }
            60% { border-color: #00ffff; }
            80% { border-color: #ff00ff; }
            100% { transform: rotate(360deg); border-color: #ff0000; }
        }

        .main-title {
            font-size: 2.5em;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(201, 169, 97, 0.5);
            margin-bottom: 30px;
        }

        .hero-image {
            width: 100%;
            max-width: 1000px;
            height: 500px;
            margin: 0 auto 40px;
            border: 3px solid rgba(201, 169, 97, 0.3);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: rgba(10, 10, 20, 0.95);
            border-right: 2px solid rgba(201, 169, 97, 0.2);
            padding: 150px 20px 20px;
            overflow-y: auto;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            padding: 15px 20px;
            background: rgba(201, 169, 97, 0.05);
            border: 1px solid rgba(201, 169, 97, 0.2);
            border-radius: 10px;
            color: #c9a961;
            text-decoration: none;
            font-size: 1.1em;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            display: block;
        }

        .nav-item:hover {
            background: rgba(201, 169, 97, 0.15);
            border-color: #c9a961;
            transform: translateX(10px);
        }

        /* Стиль для активной кнопки */
        .nav-item.active {
            background: rgba(201, 169, 97, 0.2);
            border-color: #c9a961;
            box-shadow: 0 0 20px rgba(201, 169, 97, 0.1);
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .nav-sidebar {
                width: 100%;
                position: relative;
                padding: 120px 20px 20px;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="logo-frame">
            <div class="rotating-border"></div>
            <img src="favicon.ico" alt="РКС">
        </div>
        <h1 class="main-title">Республика Когнитивного Суверенитета</h1>
        
        <div class="hero-image">
            <img src="rks-republic.jpg" alt="Республика Когнитивного Суверенитета">
        </div>
    </header>

    <nav class="nav-sidebar">
        <div class="nav-menu">
            <!-- ===== КНОПКА "ОБЩЕНИЕ" ВЕДЁТ НА СТРАНИЦУ ЧАТА ===== -->
            <a href="chat/index.html" class="nav-item">💬 Общение</a>
            <a href="constitution/index.html" class="nav-item">📜 Конституция</a>
            <a href="passport/index.html" class="nav-item">🪪 Паспорт</a>
            <a href="bank/index.html" class="nav-item">🏦 Банк</a>
            <a href="money/index.html" class="nav-item">💰 Денежные Знаки</a>
            <a href="projects/index.html" class="nav-item">💡 Проекты Граждан</a>
        </div>
    </nav>

    <main class="main-content">
        <div style="text-align: center; padding: 100px 20px;">
            <h2 style="font-size: 2em; margin-bottom: 20px; letter-spacing: 4px;">Добро пожаловать в РКС</h2>
            <p style="font-size: 1.2em; color: rgba(201,169,97,0.8); max-width: 800px; margin: 0 auto; line-height: 1.8;">
                Республика Когнитивного Суверенитета — государство будущего, где каждый гражданин реализует свой потенциал.
            </p>
        </div>
    </main>

</body>
</html>
