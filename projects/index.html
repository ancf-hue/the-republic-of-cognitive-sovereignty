
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS — Citizens' Projects</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0a0a2a 40%, #0f0f3a 100%);
            color: #c9a961;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(201, 169, 97, 0.03);
            border: 2px solid rgba(201, 169, 97, 0.25);
            border-radius: 24px;
            padding: 40px 35px 50px;
            position: relative;
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #c9a961, #f4e4d4, #c9a961);
            border-radius: 24px 24px 0 0;
        }

        /* ===== ЛОГОТИП И ЗАГОЛОВОК ===== */
        .logo-center { text-align: center; margin-bottom: 10px; }
        .logo-wrapper { display: inline-block; position: relative; width: 90px; height: 90px; }
        .logo-wrapper img {
            width: 60px; height: 60px; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 2;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }
        .logo-frame {
            position: absolute; width: 90px; height: 90px;
            border: 3px solid transparent; border-radius: 18px;
            animation: rotateFrame 8s linear infinite, rainbowGlow 4s ease-in-out infinite;
        }
        @keyframes rotateFrame { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rainbowGlow {
            0%, 100% { border-color: #ff0000; box-shadow: 0 0 25px rgba(255,0,0,0.6), 0 0 50px rgba(255,0,0,0.2); }
            20% { border-color: #ffff00; box-shadow: 0 0 25px rgba(255,255,0,0.6), 0 0 50px rgba(255,255,0,0.2); }
            40% { border-color: #00ff00; box-shadow: 0 0 25px rgba(0,255,0,0.6), 0 0 50px rgba(0,255,0,0.2); }
            60% { border-color: #00ffff; box-shadow: 0 0 25px rgba(0,255,255,0.6), 0 0 50px rgba(0,255,255,0.2); }
            80% { border-color: #ff00ff; box-shadow: 0 0 25px rgba(255,0,255,0.6), 0 0 50px rgba(255,0,255,0.2); }
        }
        .logo-title {
            font-size: 1.6em; letter-spacing: 8px; text-transform: uppercase;
            color: #c9a961; text-shadow: 0 0 30px rgba(201,169,97,0.2); margin-top: 12px;
        }
        .logo-sub { font-size: 0.7em; color: rgba(201,169,97,0.3); letter-spacing: 6px; margin-top: 3px; }

        /* ===== ОКНО ДЛЯ ФОТО 800x450 ===== */
        .photo-frame {
            width: 800px;
            height: 450px;
            max-width: 100%;
            margin: 25px auto 15px;
            position: relative;
            border: 3px solid #c9a961;
            border-radius: 10px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(201,169,97,0.1) 0%, rgba(0,0,0,0.6) 100%);
            box-shadow: 
                0 0 25px rgba(201,169,97,0.5),
                inset 0 0 20px rgba(201,169,97,0.2),
                0 15px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .photo-frame::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(201,169,97,0.4);
            border-radius: 6px;
            pointer-events: none;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 4px;
            filter: sepia(0.2) contrast(1.1);
        }
        .photo-caption {
            text-align: center;
            color: #c9a961;
            font-size: 0.9em;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            text-shadow: 0 0 10px rgba(201,169,97,0.6);
        }

        /* ===== СЕКЦИЯ ПРОЕКТОВ ===== */
        .section-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(201,169,97,0.15);
        }
        .section-header h2 {
            font-size: 1.8em;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #c9a961;
            text-shadow: 0 0 20px rgba(201,169,97,0.3);
        }
        .section-header p {
            color: rgba(201,169,97,0.5);
            font-size: 0.95em;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        /* ===== КАРТОЧКА ПРОЕКТА ===== */
        .project-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(201, 169, 97, 0.2);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a961, transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .project-card:hover {
            border-color: #c9a961;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(201, 169, 97, 0.15);
        }
        .project-card:hover::before { opacity: 1; }

        .project-card .project-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-align: center;
        }
        .project-card h3 {
            font-size: 1.3em;
            color: #f4e4d4;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-align: center;
        }
        .project-card .project-desc {
            color: rgba(201,169,97,0.6);
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
            text-align: center;
        }
        .project-card .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .project-card .tech-tag {
            font-size: 0.7em;
            padding: 4px 12px;
            background: rgba(201,169,97,0.1);
            border: 1px solid rgba(201,169,97,0.3);
            border-radius: 20px;
            color: #c9a961;
            letter-spacing: 1px;
        }
        .project-card .project-link {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: linear-gradient(145deg, rgba(201,169,97,0.9), rgba(180,150,70,0.95));
            color: #0a0a0a;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(201,169,97,0.2);
            border: none;
            cursor: pointer;
        }
        .project-card .project-link:hover {
            background: linear-gradient(145deg, #f4e4d4, #c9a961);
            box-shadow: 0 6px 25px rgba(201,169,97,0.4);
            transform: translateY(-2px);
        }

        /* ===== КАРТОЧКА "ДОБАВИТЬ ПРОЕКТ" ===== */
        .project-card.add-project {
            border: 2px dashed rgba(201,169,97,0.3);
            background: rgba(201,169,97,0.02);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .project-card.add-project:hover {
            border-color: #c9a961;
            background: rgba(201,169,97,0.05);
        }
        .project-card.add-project .add-icon {
            font-size: 3em;
            color: rgba(201,169,97,0.4);
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .project-card.add-project:hover .add-icon {
            color: #c9a961;
            transform: scale(1.1);
        }
        .project-card.add-project h3 {
            color: rgba(201,169,97,0.7);
            font-size: 1.1em;
        }
        .project-card.add-project .project-desc {
            font-size: 0.85em;
            margin-bottom: 0;
        }

        /* ===== НЕ ВЕРИФИЦИРОВАН ===== */
        .not-verified-message {
            text-align: center;
            padding: 40px 20px;
            background: rgba(201,169,97,0.05);
            border: 2px solid rgba(201,169,97,0.15);
            border-radius: 16px;
        }
        .not-verified-message .icon {
            font-size: 4em;
            display: block;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .not-verified-message h2 {
            color: #c9a961;
            margin-bottom: 10px;
            font-size: 1.8em;
            letter-spacing: 4px;
        }
        .not-verified-message p {
            color: rgba(201,169,97,0.6);
            font-size: 1em;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* ===== КНОПКИ ===== */
        .btn-3d {
            position: relative;
            display: inline-block;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-family: 'Times New Roman', serif;
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #0a0a0a;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: linear-gradient(145deg, rgba(201,169,97,0.9), rgba(180,150,70,0.95));
            box-shadow: 0 6px 28px rgba(201,169,97,0.25), inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.15);
            transform: perspective(800px) rotateX(1.5deg) rotateY(0deg);
            text-shadow: 0 1px 0 rgba(255,255,255,0.25);
        }
        .btn-3d:hover {
            transform: perspective(800px) rotateX(1.5deg) rotateY(3deg) translateY(-3px);
            box-shadow: 0 10px 40px rgba(201,169,97,0.4), 0 0 30px rgba(201,169,97,0.1), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.15);
        }
        .btn-3d.secondary {
            background: transparent;
            border: 2px solid rgba(201,169,97,0.4);
            color: #c9a961;
            box-shadow: none;
        }
        .btn-3d.secondary:hover {
            background: rgba(201,169,97,0.1);
            border-color: #c9a961;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(135deg, #0a0a2a, #0f0f3a);
            border: 2px solid #c9a961;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(201,169,97,0.3);
        }
        .modal h2 {
            text-align: center;
            color: #c9a961;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        .modal .form-group { margin-bottom: 16px; }
        .modal .form-group label {
            display: block;
            font-size: 0.75em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(201,169,97,0.5);
            margin-bottom: 6px;
        }
        .modal .form-group input,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(201,169,97,0.15);
            border-radius: 8px;
            color: #f4e4d4;
            font-family: 'Times New Roman', serif;
            font-size: 1em;
            transition: all 0.3s;
        }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: #c9a961;
            box-shadow: 0 0 15px rgba(201,169,97,0.1);
        }
        .modal .form-group textarea { min-height: 80px; resize: vertical; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-actions .btn-3d {
            flex: 1;
            min-width: 120px;
            padding: 14px 24px;
        }

        /* ===== КНОПКА ВОЗВРАТА ===== */
        .back-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 30px;
            border-top: 1px solid rgba(201,169,97,0.15);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 650px) {
            .container { padding: 25px 16px 30px; border-radius: 18px; }
            .logo-title { font-size: 1.2em; letter-spacing: 4px; }
            .logo-wrapper { width: 70px; height: 70px; }
            .logo-wrapper img { width: 45px; height: 45px; }
            .logo-frame { width: 70px; height: 70px; border-radius: 14px; }
            .photo-frame { width: 95vw; height: auto; aspect-ratio: 16 / 9; }
            .section-header h2 { font-size: 1.3em; letter-spacing: 3px; }
            .projects-grid { grid-template-columns: 1fr; }
            .btn-3d { width: 100%; text-align: center; }
            .modal { padding: 20px; }
            .modal-actions .btn-3d { min-width: 100%; }
        }

        /* ===== 3D GLASS LANGUAGE TOGGLE BUTTON - RU/EN FORMAT ===== */
        .lang-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
            perspective: 800px;
        }

        .lang-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            min-width: 120px;
            height: 52px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Times New Roman', serif;
            font-size: 1em;
            font-weight: bold;
            letter-spacing: 2px;
            color: #f5e6a8;
            text-shadow: 0 0 8px rgba(201, 169, 97, 0.9);

            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.15) 0%,
                rgba(201, 169, 97, 0.10) 40%,
                rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);

            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-right: 1px solid rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.55),
                0 0 25px rgba(201, 169, 97, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -2px 6px rgba(0, 0, 0, 0.25);

            transform: rotateX(12deg) rotateY(-6deg) translateZ(0);
            transform-style: preserve-3d;
            transition: transform 0.35s ease, box-shadow 0.35s ease, filter 0.35s ease;

            animation: glassGlow 3.5s ease-in-out infinite;
        }

        @keyframes glassGlow {
            0%, 100% {
                box-shadow:
                    0 10px 25px rgba(0, 0, 0, 0.55),
                    0 0 25px rgba(201, 169, 97, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35),
                    inset 0 -2px 6px rgba(0, 0, 0, 0.25);
            }
            50% {
                box-shadow:
                    0 10px 25px rgba(0, 0, 0, 0.55),
                    0 0 45px rgba(201, 169, 97, 0.75),
                    0 0 80px rgba(201, 169, 97, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.45),
                    inset 0 -2px 6px rgba(0, 0, 0, 0.25);
            }
        }

        .lang-btn::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 8%;
            right: 8%;
            height: 35%;
            background: linear-gradient(180deg,
                rgba(255, 255, 255, 0.55) 0%,
                rgba(255, 255, 255, 0) 100%);
            border-radius: 14px 14px 50% 50%;
            pointer-events: none;
        }

        .lang-btn:hover {
            transform: rotateX(6deg) rotateY(-3deg) translateZ(10px) scale(1.05);
            filter: brightness(1.15);
        }

        .lang-btn:active {
            transform: rotateX(14deg) rotateY(-8deg) translateZ(-5px) scale(0.98);
            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(201, 169, 97, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -2px 6px rgba(0, 0, 0, 0.35);
        }

        .lang-text {
            font-weight: 900;
            letter-spacing: 3px;
        }

        .lang-active {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.9);
        }

        .lang-separator {
            color: rgba(201, 169, 97, 0.5);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- ===== 3D GLASS LANGUAGE TOGGLE - RU/EN ===== -->
    <div class="lang-toggle">
        <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">
            <span class="lang-text" id="langText">
                <span class="lang-active">EN</span><span class="lang-separator">/</span><span>RU</span>
            </span>
        </button>
    </div>

    <div class="container">
        <!-- ЛОГОТИП И НАЗВАНИЕ -->
        <div class="logo-center">
            <div class="logo-wrapper">
                <div class="logo-frame"></div>
                <img src="favicon.ico" alt="RCS">
            </div>
            <div class="logo-title">RCS</div>
            <div class="logo-sub" data-ru="Республика Когнитивного Суверенитета" data-en="Republic of Cognitive Sovereignty">Republic of Cognitive Sovereignty</div>
        </div>

        <!-- ОКНО ДЛЯ ФОТО 800x450 -->
        <div class="photo-frame">
            <img src="rks-portrait.jpg" alt="State Emblem of RCS">
        </div>
        <div class="photo-caption" data-ru="Государственная Эмблема РКС" data-en="State Emblem of RCS">State Emblem of RCS</div>

        <!-- ===== КОНТЕНТ (динамический) ===== -->
        <div id="mainContent"></div>

        <!-- ===== КНОПКА ВОЗВРАТА НА ГЛАВНУЮ ===== -->
        <div class="back-section">
            <button class="btn-3d secondary" onclick="goToMainPage()" data-ru="← Вернуться к проектам" data-en="← Back to Main">
                ← Back to Main
            </button>
        </div>

    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ДОБАВЛЕНИЯ ПРОЕКТА ===== -->
    <div class="modal-overlay" id="addProjectModal">
        <div class="modal">
            <h2 data-ru="Добавить проект" data-en="Add Project">Add Project</h2>
            <div class="form-group">
                <label data-ru="Название" data-en="Title">Title</label>
                <input type="text" id="projectTitle" data-placeholder-ru="Название вашего проекта" data-placeholder-en="Your project title" placeholder="Your project title">
            </div>
            <div class="form-group">
                <label data-ru="Описание" data-en="Description">Description</label>
                <textarea id="projectDesc" data-placeholder-ru="Опишите ваш проект" data-placeholder-en="Describe your project" placeholder="Describe your project"></textarea>
            </div>
            <div class="form-group">
                <label data-ru="Технологии" data-en="Technologies">Technologies</label>
                <input type="text" id="projectTech" data-placeholder-ru="React, Python, AI, ..." data-placeholder-en="React, Python, AI, ..." placeholder="React, Python, AI, ...">
            </div>
            <div class="form-group">
                <label data-ru="Ссылка" data-en="Link">Link</label>
                <input type="text" id="projectLink" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="btn-3d secondary" onclick="closeAddProjectModal()" data-ru="Отмена" data-en="Cancel">Cancel</button>
                <button class="btn-3d" onclick="saveProject()" data-ru="Опубликовать" data-en="Publish">Publish</button>
            </div>
        </div>
    </div>

    <script>
        // ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
        let currentLang = 'en';
        let projects = [];

        // ===== ЗАГРУЗКА ДАННЫХ =====
        function loadProjects() {
            try {
                const saved = localStorage.getItem('rks_projects');
                if (saved) {
                    projects = JSON.parse(saved);
                } else {
                    // Демо-проекты
                    const author = JSON.parse(localStorage.getItem('rks_citizen') || '{"fullName":"Citizen"}').fullName || 'Citizen';
                    projects = [
                        {
                            id: 1,
                            title: 'AI Content Verifier',
                            desc: 'A local system for verifying the authenticity of digital content using lightweight neural networks. Runs entirely in the browser without sending data to a server.',
                            tech: ['TensorFlow Lite', 'WebGL', 'AI'],
                            link: '#',
                            author: author
                        },
                        {
                            id: 2,
                            title: 'RCS Chat',
                            desc: 'Decentralized communication platform for RCS citizens with end-to-end encryption and cognitive security features.',
                            tech: ['WebRTC', 'Encryption', 'P2P'],
                            link: '#',
                            author: 'Petrov P.P.'
                        }
                    ];
                    saveProjects();
                }
            } catch (e) {
                projects = [];
            }
        }

        function saveProjects() {
            try {
                localStorage.setItem('rks_projects', JSON.stringify(projects));
            } catch (e) {}
        }

        // ===== ПРОВЕРКА ПАСПОРТА =====
        function isVerified() {
            return localStorage.getItem('rks_verified') === 'true';
        }

        // ===== ОТОБРАЖЕНИЕ =====
        function renderProjects() {
            const container = document.getElementById('mainContent');
            const verified = isVerified();

            if (!verified) {
                container.innerHTML = `
                    <div class="not-verified-message">
                        <span class="icon">🔒</span>
                        <h2 data-ru="Требуется верификация" data-en="Verification Required">Verification Required</h2>
                        <p data-ru="Для просмотра и публикации проектов необходимо пройти верификацию личности в разделе Паспорт." 
                           data-en="To view and publish projects, you need to verify your identity in the Passport section.">
                           To view and publish projects, you need to verify your identity in the Passport section.
                        </p>
                        <a href="../passport/index.html" class="btn-3d" data-ru="Пройти верификацию" data-en="Go to Passport">Go to Passport</a>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="section-header">
                    <h2 data-ru="🚀 Проекты граждан" data-en="🚀 Citizens' Projects">🚀 Citizens' Projects</h2>
                    <p data-ru="Платформа для демонстрации инновационных разработок резидентов РКС" 
                       data-en="A platform for showcasing innovative developments by RCS residents">
                       A platform for showcasing innovative developments by RCS residents
                    </p>
                </div>
                <div class="projects-grid">
            `;

            // Карточки проектов
            projects.forEach(proj => {
                const techHtml = proj.tech.map(t => `<span class="tech-tag">${t}</span>`).join('');
                const icon = proj.icon || '🚀';
                html += `
                    <div class="project-card">
                        <div class="project-icon">${icon}</div>
                        <h3>${proj.title}</h3>
                        <p class="project-desc">${proj.desc}</p>
                        <div class="project-tech">${techHtml}</div>
                        <div style="font-size:0.7em; color:rgba(201,169,97,0.4); margin-bottom:10px; text-align:center;">by ${proj.author}</div>
                        <a href="${proj.link}" class="project-link" data-ru="Подробнее ↗" data-en="Learn More ↗">Learn More ↗</a>
                    </div>
                `;
            });

            // Карточка "Добавить проект"
            html += `
                <div class="project-card add-project" onclick="openAddProjectModal()">
                    <div class="add-icon">+</div>
                    <h3 data-ru="Добавить свой проект" data-en="Add Your Project">Add Your Project</h3>
                    <p class="project-desc" data-ru="Вы программист, дизайнер или исследователь? Представьте свою разработку сообществу РКС."
                       data-en="Are you a programmer, designer, or researcher? Present your development to the RCS community.">
                       Are you a programmer, designer, or researcher? Present your development to the RCS community.
                    </p>
                </div>
            `;

            html += `</div>`;
            container.innerHTML = html;
        }

        // ===== МОДАЛЬНОЕ ОКНО =====
        function openAddProjectModal() {
            if (!isVerified()) {
                showNotification(
                    currentLang === 'ru' ? '🔒 Требуется верификация' : '🔒 Verification Required',
                    currentLang === 'ru' ? 'Пройдите верификацию в разделе Паспорт' : 'Verify your identity in the Passport section'
                );
                return;
            }
            document.getElementById('addProjectModal').classList.add('active');
            document.getElementById('projectTitle').value = '';
            document.getElementById('projectDesc').value = '';
            document.getElementById('projectTech').value = '';
            document.getElementById('projectLink').value = '';
        }

        function closeAddProjectModal() {
            document.getElementById('addProjectModal').classList.remove('active');
        }

        function saveProject() {
            const title = document.getElementById('projectTitle').value.trim();
            const desc = document.getElementById('projectDesc').value.trim();
            const techStr = document.getElementById('projectTech').value.trim();
            const link = document.getElementById('projectLink').value.trim();

            if (!title || !desc) {
                showNotification(
                    currentLang === 'ru' ? '❌ Ошибка' : '❌ Error',
                    currentLang === 'ru' ? 'Заполните название и описание' : 'Fill in title and description'
                );
                return;
            }

            const tech = techStr ? techStr.split(',').map(s => s.trim()).filter(s => s) : [];
            const author = JSON.parse(localStorage.getItem('rks_citizen') || '{"fullName":"Citizen"}').fullName || 'Citizen';

            projects.push({
                id: Date.now(),
                title: title,
                desc: desc,
                tech: tech,
                link: link || '#',
                author: author,
                icon: '🚀'
            });

            saveProjects();
            renderProjects();
            closeAddProjectModal();
            showNotification(
                currentLang === 'ru' ? '✅ Проект опубликован!' : '✅ Project published!',
                `${title} ${currentLang === 'ru' ? 'добавлен в каталог проектов' : 'added to the projects catalog'}`
            );
        }

        // ===== УВЕДОМЛЕНИЯ =====
        function showNotification(title, message) {
            const n = document.createElement('div');
            n.style.cssText = `
                position: fixed; top: 85px; right: 20px; padding: 14px 22px;
                background: rgba(201,169,97,0.95); color: #0a0a0a;
                border-radius: 12px; box-shadow: 0 5px 30px rgba(0,0,0,0.6);
                z-index: 2000; max-width: 350px; font-weight: bold;
                animation: slideIn 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            `;
            n.innerHTML = `<h3 style="margin-bottom:3px; font-size:1em; letter-spacing:2px;">${title}</h3><p style="font-size:0.85em;">${message}</p>`;
            document.body.appendChild(n);
            setTimeout(() => { if (n.parentNode) n.remove(); }, 4000);
        }

        // Добавляем анимацию в head
        const styleAnim = document.createElement('style');
        styleAnim.textContent = `
            @keyframes slideIn {
                from { transform: translateX(400px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(styleAnim);

        // ===== ВОЗВРАТ НА ГЛАВНУЮ =====
        function goToMainPage() {
            var currentUrl = window.location.href;
            var pathParts = currentUrl.split('/');
            pathParts.pop();
            var lastPart = pathParts[pathParts.length - 1];
            var subfolders = ['constitution', 'passport', 'bank', 'money', 'projects', 'chat'];
            if (subfolders.includes(lastPart)) {
                pathParts.pop();
            }
            pathParts.push('index.html');
            window.location.href = pathParts.join('/');
        }

        // ===== ЯЗЫК =====
        function updateLangDisplay() {
            const langTextEl = document.getElementById('langText');
            if (currentLang === 'en') {
                langTextEl.innerHTML = '<span class="lang-active">EN</span><span class="lang-separator">/</span><span>RU</span>';
            } else {
                langTextEl.innerHTML = '<span>EN</span><span class="lang-separator">/</span><span class="lang-active">RU</span>';
            }
        }

        function applyLang(lang) {
            currentLang = lang;
            document.documentElement.setAttribute('lang', lang);

            document.querySelectorAll('[data-ru][data-en]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
            document.querySelectorAll('[data-placeholder-ru][data-placeholder-en]').forEach(el => {
                el.placeholder = el.getAttribute('data-placeholder-' + lang);
            });

            const titleEl = document.querySelector('title');
            if (titleEl) {
                titleEl.textContent = lang === 'ru' ? 'РКС — Проекты граждан' : 'RCS — Citizens\' Projects';
            }

            renderProjects();
            updateLangDisplay();

            try { localStorage.setItem('rks-lang', lang); } catch (e) {}
        }

        document.getElementById('langBtn').addEventListener('click', () => {
            applyLang(currentLang === 'en' ? 'ru' : 'en');
        });

        // Закрытие модалки по клику вне
        document.getElementById('addProjectModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddProjectModal();
        });

        // ===== АНИМАЦИЯ ПОЯВЛЕНИЯ КАРТОЧЕК =====
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.project-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 150 * index);
            });
        });

        // ===== ЗАПУСК =====
        try {
            const savedLang = localStorage.getItem('rks-lang');
            if (savedLang === 'ru' || savedLang === 'en') {
                currentLang = savedLang;
            }
        } catch (e) {}

        loadProjects();
        applyLang(currentLang);
    </script>
</body>
</html>
